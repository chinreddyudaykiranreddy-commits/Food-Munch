<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Food Munch Checkout - Complete your food order."
    >

    <title>Food Munch | Checkout</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="header">

        <nav class="navbar">

            <div class="container navbar-container">

                <a
                    href="index.html"
                    class="logo"
                >
                    Food Munch
                </a>


                <!-- Navigation Actions -->

                <div class="checkout-nav-actions">

                    <a
                        href="index.html"
                        class="back-to-menu"
                    >
                        ← Back to Menu
                    </a>


                    <!-- Admin Dashboard -->

                    <a
                        href="admin.html"
                        class="back-to-menu"
                        id="adminNavItem"
                        style="display: none;"
                    >
                        Admin Dashboard
                    </a>

                </div>

            </div>

        </nav>

    </header>


    <!-- =========================
         CHECKOUT
    ========================== -->

    <main class="checkout-page">

        <div class="container checkout-container">


            <!-- Page Heading -->

            <div class="section-heading">

                <p class="section-subtitle">
                    Complete Your Order
                </p>

                <h1 class="section-title">
                    Checkout
                </h1>

                <p class="section-description">
                    Enter your delivery details and review your order.
                </p>

            </div>


            <!-- Checkout Layout -->

            <div class="checkout-layout">


                <!-- =========================
                     DELIVERY DETAILS
                ========================== -->

                <section class="checkout-card">

                    <h2>
                        Delivery Details
                    </h2>

                    <form id="checkoutForm">


                        <!-- Full Name -->

                        <div class="form-group">

                            <label for="customerName">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="customerName"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <!-- Phone -->

                        <div class="form-group">

                            <label for="customerPhone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="customerPhone"
                                placeholder="Enter your phone number"
                                pattern="[0-9]{10}"
                                maxlength="10"
                                required
                            >

                        </div>


                        <!-- Email -->

                        <div class="form-group">

                            <label for="customerEmail">
                                Email
                            </label>

                            <input
                                type="email"
                                id="customerEmail"
                                placeholder="Enter your email"
                                required
                            >

                        </div>


                        <!-- Address -->

                        <div class="form-group">

                            <label for="customerAddress">
                                Delivery Address
                            </label>

                            <textarea
                                id="customerAddress"
                                placeholder="Enter your complete delivery address"
                                rows="4"
                                required
                            ></textarea>

                        </div>


                        <!-- City -->

                        <div class="form-group">

                            <label for="customerCity">
                                City
                            </label>

                            <input
                                type="text"
                                id="customerCity"
                                placeholder="Enter your city"
                                required
                            >

                        </div>


                        <!-- Pincode -->

                        <div class="form-group">

                            <label for="customerPincode">
                                Pincode
                            </label>

                            <input
                                type="text"
                                id="customerPincode"
                                placeholder="Enter 6-digit pincode"
                                pattern="[0-9]{6}"
                                maxlength="6"
                                required
                            >

                        </div>


                        <!-- Payment Method -->

                        <div class="form-group">

                            <label for="paymentMethod">
                                Payment Method
                            </label>

                            <select
                                id="paymentMethod"
                                required
                            >

                                <option value="">
                                    Select Payment Method
                                </option>

                                <option value="Cash on Delivery">
                                    Cash on Delivery
                                </option>

                                <option value="UPI">
                                    UPI
                                </option>

                                <option value="Card">
                                    Credit / Debit Card
                                </option>

                            </select>

                        </div>


                        <!-- Place Order -->

                        <button
                            type="submit"
                            class="checkout-place-order-btn"
                        >
                            Place Order
                        </button>

                    </form>

                </section>


                <!-- =========================
                     ORDER SUMMARY
                ========================== -->

                <section class="checkout-card order-summary-card">

                    <h2>
                        Order Summary
                    </h2>


                    <!-- Items -->

                    <div
                        id="checkoutItems"
                        class="checkout-items"
                    >
                        <!-- Items added by JavaScript -->
                    </div>


                    <!-- Summary -->

                    <div class="checkout-summary">


                        <div class="checkout-summary-row">

                            <span>
                                Subtotal
                            </span>

                            <span id="checkoutSubtotal">
                                ₹0
                            </span>

                        </div>


                        <div class="checkout-summary-row">

                            <span>
                                Delivery
                            </span>

                            <span id="checkoutDelivery">
                                ₹0
                            </span>

                        </div>


                        <div class="checkout-summary-divider">
                        </div>


                        <div
                            class="checkout-summary-row checkout-total-row"
                        >

                            <span>
                                Total
                            </span>

                            <span id="checkoutTotal">
                                ₹0
                            </span>

                        </div>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 Food Munch. All rights reserved.
            </p>

        </div>

    </footer>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/checkout.js"></script>

</body>

</html>
