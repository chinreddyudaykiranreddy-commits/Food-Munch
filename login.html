<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Food Munch - Login</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <h1>Food Munch</h1>

                <h2>Welcome Back</h2>

                <p class="auth-subtitle">
                    Login to continue ordering delicious food.
                </p>


                <form id="loginForm">

                    <div class="form-group">

                        <label for="loginEmail">
                            Email
                        </label>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="loginPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter password"
                            required
                        >

                    </div>


                    <button
                        type="submit"
                        class="auth-button"
                    >
                        Login
                    </button>

                </form>


                <p class="auth-footer">

                    Don't have an account?

                    <a href="register.html">
                        Create Account
                    </a>

                </p>

            </div>

        </div>

    </main>


    <script src="js/auth.js"></script>

</body>

</html>
